recipe_version: "1"
runtime: vllm
name: glm-4-7
  #container: vllm-node
container: vllm/vllm-openai:qwen38-flash-next

env:
  # NCCL tuning (plain names reach the engine; interface/HCA vars are
  # launcher-injected from .env — do not duplicate)
  NCCL_IB_TC: "106"
  NCCL_NET_PLUGIN: "none"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_DEBUG: "WARN"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.86

command: |
  vllm serve unsloth/GLM-4.7-FP8 \
        --tool-call-parser glm47 \
        --reasoning-parser glm45 \
        --enable-prefix-caching \
        --speculative-config.method mtp \
        --speculative-config.num_speculative_tokens 1 \
        --max-model-len auto \
        --kv-cache-dtype fp8 \
        --enable-auto-tool-choice \
        --max-num-seqs 4 \
        -tp 4 \
        --gpu-memory-utilization 0.85 \
        --host 0.0.0.0 \
        --port {port} 
