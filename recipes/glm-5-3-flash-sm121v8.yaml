# GLM-5.3-Flash FP8 — TP=4 across 4x DGX Spark, radixark SM121-v8 image
# Native FP8, NoPE sparse-MLA path on SM121 (see Wpnx330/GLM-5.3-Flash-FP8-4x-DGX-Spark).
#
# IMAGE: radixark/vllm-glm53-flash:sm121-v8 — NOT built by this repo.
#   Built on the head by Wpnx330/GLM-5.3-Flash-FP8-4x-DGX-Spark/scripts/build-image.sh
#   (official vllm/vllm-openai:glm53-flash-arm64-cu130 + SM121 layers v1-v8:
#   NoPE MLA backend, FlashInfer 0.6.18, NCCL 2.30.7, cutlass-dsl 4.6.2,
#   PDL gate, indexer hardening, fp8 KV CTA cap).
#   Distribute the prepared image with --no-build (a plain
#   `build-and-copy.sh -t <tag>` would pull the nightly runner and re-tag
#   OVER the sm121-v8 image — do not let --setup "build" it):
#     ./build-and-copy.sh -t radixark/vllm-glm53-flash:sm121-v8 --no-build -c --copy-parallel
#   Then this recipe (or launch-cluster.sh -t ...) can run directly.
#
# MODS: mods/glm53-flash-indexer is REQUIRED on GB10. The image's indexer
#   decode path selects persistent_topk (select_k=512 for GLM-5.3), which
#   oversubscribes as decode contexts grow and whose FilteredTopK fallback
#   needs >=128KB smem vs GB10's 101KB — it kills the worker under load,
#   with or without CUDA graphs. The mod gates SM12x onto top_k_per_row_*,
#   which also lets CUDA graphs capture cleanly (this recipe runs graphs on;
#   no --enforce-eager). Files are byte-identical to Wpnx330's patches/.
#
# Lanes (occupancy, not peak-full-window math): 200k/15, 500k/5, 1m/3 seqs:
#   ./run-recipe.sh glm-5-3-flash-sm121v8 --max-model-len 200000 -- --max-num-seqs 15
#   ./run-recipe.sh glm-5-3-flash-sm121v8 --max-model-len 500000 -- --max-num-seqs 5
#   (1M is the default)
# MTP: k=4 on the fixed 08-29 weights (2.87/5 mean-accepted, +2% over k=3);
#   override: --mtp-k 3
#
# 2026-09-06 (rev 1): new recipe for the freshly rebuilt sm121-v8 image.
#   Command/env are the Wpnx330 canonical flags (fp8_e4m3, block-size 2304,
#   --async-scheduling, graphs on, arch list 12.1a) on the current
#   recipe_version 1 schema (plain env names reach the engine via the
#   generated launch script; NCCL_IB_HCA/NCCL_SOCKET_IFNAME/GLOO_SOCKET_IFNAME/
#   NCCL_IB_DISABLE/NCCL_IGNORE_CPU_AFFINITY stay launcher-injected from .env).

recipe_version: "1"
name: GLM-5.3-Flash-FP8-SM121v8
description: vLLM serving GLM-5.3-Flash FP8 (radixark SM121-v8 image), TP=4 on a 4-Spark cluster
model: dealignai/GLM-5.3-Flash-UNCENSORED-FP8  # what command: actually serves; --setup downloads this

container: radixark/vllm-glm53-flash:sm121-v8
cluster_only: true

mods:
  - mods/glm53-flash-indexer

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576
  max_num_seqs: 6
  max_num_batched_tokens: 12288
  mtp_k: 3
  gpu_memory_utilization: 0.885

env:
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  HF_HUB_OFFLINE: "1"
  # NCCL tuning (plain names reach the engine; interface/HCA vars are
  # launcher-injected from .env — do not duplicate)
  NCCL_IB_TC: "106"
  NCCL_NET_PLUGIN: "none"
  NCCL_IB_SUBNET_AWARE_ROUTING: "1"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_DEBUG: "WARN"

command: |
  vllm serve /root/.cache/huggingface/hub/models--dealignai--GLM-5.3-Flash-UNCENSORED-FP8/snapshots/d5822b068da8ddb301665b48c58718e6e18a2c3a/ \
      --served-model-name glm-5.3-flash \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --reasoning-parser glm45 \
      --tool-call-parser glm47 \
      --enable-auto-tool-choice \
      --speculative-config '{{"method":"mtp","num_speculative_tokens":{mtp_k}}}' \
      --tensor-parallel-size {tensor_parallel} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --compilation-config '{{"cudagraph_mode":"FULL"}}' \
      --block-size 2304 \
      --kv-cache-dtype fp8 \
      --async-scheduling
