# Recipe: Kimi K2.5-E304 (4-node)
# QuantTrio/Kimi-K2.5-E304 — packed INT4, 384→304 experts pruned (~444 GiB).
# DeepSeek-V3 backbone + standard MLA attention (NOT GLM's DSA → no b12x image needed).
# TP=4 across 4 DGX Spark nodes. The ONLY K2.5 quant that fits 4 nodes:
#   full INT4 (595 GB) and nvidia/Kimi-K2.5-NVFP4 (591 GB) both need 8 nodes.
#
# Ported from sparkrun-kimi-k25-4x-spark (OllieJW, NVIDIA forum t/362958 post #11),
# hardened with fabric/env tuning from ciprianveg + ignaciomichelena's K2.6
# 8-node work (t/369446).
#
# RUN WITH --ray: Kimi (MLA) is slower with the default no-Ray multi-node mode
# on Spark. The launcher starts Ray on all nodes and keeps the
# --distributed-executor-backend ray flag from the command below.
#
#   ./run-recipe.sh recipes/4x-spark-cluster/kimi-k2.5-e304.yaml --ray --setup
#
# Model provisioning, pick one:
#   a) --setup: downloads the model on the head node and copies it to all
#      workers over the cluster fabric (standard spark-vllm-docker flow).
#   b) Model already on a NAS HF hub: mount it at launch instead of downloading:
#        ./run-recipe.sh recipes/4x-spark-cluster/kimi-k2.5-e304.yaml \
#          --ray --build-only && \
#        ./run-recipe.sh recipes/4x-spark-cluster/kimi-k2.5-e304.yaml \
#          --ray -v /mnt/k8s/ai/hub:/root/.cache/huggingface/hub
#      (the NAS mount covers the launcher's default HF cache mount, and the
#       HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE env vars below keep loading local)
#
# The NCCL_* fabric tuning below matches a CRS804 200G 4-channel ring
# topology. If your .env comes from autodiscover (e.g. mesh NCCL settings),
# remove the conflicting NCCL_* lines and let .env / the launcher configure
# NCCL instead.

recipe_version: "1"
name: Kimi-K2.5-E304-4Node
description: vLLM serving QuantTrio/Kimi-K2.5-E304 (INT4, 304 experts) with TP=4 across 4 DGX Spark nodes

# HuggingFace model for --setup downloads
model: QuantTrio/Kimi-K2.5-E304

# Container: stock spark-vllm-docker image (eugr/spark-vllm:latest).
# K2.5 uses standard MLA, so the GLM b12x/DSA overlay image is NOT needed —
# only the tokenizer mod below.
container: vllm-node

cluster_only: true

mods:
  - mods/fix-kimi-tokenizer   # TF5 bytes_to_unicode import fix — MANDATORY
  - mods/drop-caches          # page-cache stall prevention during 444 GiB load

env:
  # --- GB10 / SM121 ---
  TORCH_CUDA_ARCH_LIST: "12.1a"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "32"

  # --- Marlin INT4 MoE (E304 is packed INT4 via compressed-tensors) ---
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

  # --- Unified-memory stability (prevent false OOM on 128 GB shared pool) ---
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"

  # --- RoCE fabric (CRS804 200G, 4-channel ring) ---
  NCCL_NET: "IB"
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_BUFFSIZE: "16777216"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: "WARN"

  # --- Offline (model comes from --setup download or NAS hub mount) ---
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OMP_NUM_THREADS: "4"

  # --- Cache dirs (persist in the mounted HF cache to avoid re-JIT on restart) ---
  #  TORCH_EXTENSIONS_DIR: "/root/.cache/huggingface/torch_extensions"
  #TORCHINDUCTOR_CACHE_DIR: "/root/.cache/huggingface/torchinductor-cache"
  #TRITON_CACHE_DIR: "/root/.cache/huggingface/triton-cache"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  # E304 weights ≈ 102-110 GiB/node at TP=4. Usable ≈ 115 GiB. Razor-thin:
  # 0.90 reserves ~115 GiB for weights + KV, leaving ~13 GiB for fp8 KV + graphs.
  # max-model-len auto lets vLLM self-fit whatever KV survives (expect 16-32K).
  gpu_memory_utilization: 0.6
  max_model_len: auto
  max_num_seqs: 4
  max_num_batched_tokens: 4096

# The vLLM serve command template.
# In --ray mode the launcher starts Ray on every node and keeps
# --distributed-executor-backend ray; in the default no-Ray mode the flag is
# stripped and per-node multiprocessing args are injected automatically.
# Do not pass --nnodes/--node-rank/--master-addr/--master-port/--headless here;
# the launcher supplies them.
command: |
  vllm serve QuantTrio/Kimi-K2.5-E304 \
    --host {host} \
    --port {port} \
    --served-model-name Kimi-K2.5-E304 \
    --trust-remote-code \
    --quantization compressed-tensors \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend ray \
    --attention-backend TRITON_MLA \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --tool-call-parser kimi_k2 \
    --enable-auto-tool-choice \
    --reasoning-parser kimi_k2 \
    --language-model-only 

# ─────────────────────────────────────────────────────────────────────────────
# VISION VARIANT: K2.5 is natively multimodal. The recipe above runs text-only
# (--language-model-only) to reclaim ~2-4 GiB for KV on the tight 4-node fit.
# For vision, REMOVE --language-model-only from the command and ADD:
#     --mm-encoder-tp-mode data \
#     --limit-mm-per-prompt '{"image":3,"video":0}'
# (data-parallel vision encoder, avoids TP comm on the small encoder)
# Expect ~4-8K less context headroom with the encoder resident.
#
# SPEC DECODING: deliberately OFF. ciprianveg + ignaciomichelena (t/369446)
# both found spec decode HURTS Kimi on Spark — K2.5's 3B active is too small
# for a meaningfully cheaper draft, and ngram GPU dropped decode 16→8 t/s.
# K2.5 MTP also slowed ciprianveg's setup. Do not enable without re-benchmark.
#
# 8-NODE UPGRADE PATH: serve nvidia/Kimi-K2.5-NVFP4 (591 GB) with TP=8,
# --kv-cache-dtype fp8, --enable-expert-parallel, and VLLM_USE_FLASHINFER_MOE_FP4=1
# for ~86 t/s aggregate @ c8 (16 t/s single-stream).
# ─────────────────────────────────────────────────────────────────────────────
