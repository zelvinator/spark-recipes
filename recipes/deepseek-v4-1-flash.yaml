recipe_version: '1'
name: DeepSeek-V4.1-Flash
description: vLLM serving deepseek-ai/DeepSeek-V4.1-Flash TP=4, Engram-on-disk, DSpark
  k=5, CUDA graphs (tonyd2wild boot10 port) on a 4-Spark cluster
model: deepseek-ai/DeepSeek-V4.1-Flash
container: vllm-dsv41:overlay5
cluster_only: true
mods:
- mods/dsv41-boot10-patches
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.84
  max_model_len: 1048576
  max_num_seqs: 16
  max_num_batched_tokens: 12288
  block_size: 128
env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_ENGINE_READY_TIMEOUT_S: '3600'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '1800'
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
  VLLM_HAS_FLASHINFER_CUBIN: '1'
  VLLM_USE_RUST_FRONTEND: '0'
  VLLM_USE_BREAKABLE_CUDAGRAPH: '1'
  VLLM_USE_FLASHINFER_SAMPLER: '0'
  MAX_JOBS: '2'
  FLASHINFER_NVCC_THREADS: '1'
  DSV41_ENGRAM_DISK: '1'
  DSV41_ENGRAM_DISK_THREADS: '128'
  DSV41_ENGRAM_DISK_CHUNK: '16'
  NCCL_NVLS_ENABLE: '0'
  NCCL_CROSS_NIC: '1'
  NCCL_IB_MERGE_NICS: '0'
  NCCL_CUMEM_ENABLE: '0'
  TORCH_NCCL_ASYNC_ERROR_HANDLING: '1'
  NCCL_DEBUG: WARN
  NCCL_IB_TC: '106'
  NCCL_NET_PLUGIN: none
  NCCL_IB_SUBNET_AWARE_ROUTING: '1'
  NCCL_MAX_NCHANNELS: '8'
  NCCL_MIN_NCHANNELS: '4'
command: "vllm serve /root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4.1-Flash/snapshots/dba1be0a40aa45a94ad051997016db3960a90277\
  \ \\\n    --served-model-name deepseek-v4.1-flash \\\n    --host {host} \\\n   \
  \ --port {port} \\\n    --tensor-parallel-size {tensor_parallel} \\\n    --gpu-memory-utilization\
  \ {gpu_memory_utilization} \\\n    --max-model-len {max_model_len} \\\n    --max-num-seqs\
  \ {max_num_seqs} \\\n    --max-num-batched-tokens {max_num_batched_tokens} \\\n\
  \    --block-size {block_size} --enable-prefix-caching \\\n    --engram-config '{{\"cpu_offload\": false}}'\
  \ \\\n    --default-chat-template-kwargs '{{\"thinking\": false}}' \\\n    --tool-call-parser\
  \ deepseek_v41 \\\n    --enable-auto-tool-choice \\\n    --reasoning-parser deepseek_v41\
  \ \\\n    --limit-mm-per-prompt '{{\"image\": 4}}' \\\n    --mm-processor-cache-gb\
  \ 1 \\\n    --speculative-config '{{\"method\":\"dspark\", \"num_speculative_tokens\"\
  :5,\"draft_sample_method\":\"probabilistic\",\"rejection_sample_method\":\"block\"\
  ,\"enable_adaptive_verification\":false}}' \\\n    --compilation-config '{{\"cudagraph_mode\"\
  :\"FULL_AND_PIECEWISE\",\"cudagraph_capture_sizes\":[5,6,10,12,15,18,20,24,25,30,35,36,40,42,45,48,50,54,55,60,65,66,70,72,75,78,80,84,90,96]}}'\n"
