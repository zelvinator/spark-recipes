recipe_version: "1"
name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
description: vLLM native distributed serving nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 (no Ray)
model: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4

runtime: vllm
container: vllm-node-tf5-master

build_args:
  - --tf5

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.82
  max_model_len: 262144

command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 \
    --trust-remote-code \
    --tensor-parallel-size 4 \
    --moe-backend cutlass \
    --kv-cache-dtype fp8 \
    --max-model-len 262144 \
    --max-num-seqs 4 \
    --max-num-batched-tokens 512 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser nemotron_v3 \
    --attention-backend TRITON_ATTN \
    --mamba_ssm_cache_dtype float32 

